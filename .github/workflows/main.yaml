name: Main Workflow

on:
  pull_request: {}
  push:
    branches:
      - main

jobs:
  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Run unit tests
        run: make test-unit

  acceptance_tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Setup Terraform with specified version on the runner
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false
      - name: Run acceptance tests
        # Pin the Terraform binary so the test framework doesn't try to auto-install
        # one (the bundled HashiCorp release-signing key has expired).
        run: TF_ACC_TERRAFORM_PATH="$(which terraform)" make test-acc-replay

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Setup Terraform with specified version on the runner
        uses: hashicorp/setup-terraform@v2
        with:
            terraform_wrapper: false

      - name: Check the docs are up to date
        run: make check-docs

      - name: Run linters
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
