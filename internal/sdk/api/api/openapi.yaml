components:
  parameters: {}
  schemas:
    user:
      additionalProperties: false
      description: This object represents a user.
      properties:
        id:
          description: The ID of the user.
          example: user_1234
          pattern: "user_([a-z0-9]+)"
          type: string
        legacy_id:
          description: The legacy ID of the user.
          type: number
        email:
          description: The email of the user.
          format: email
          type: string
        active:
          description: Whether the user is active or not.
          type: boolean
        created_at:
          description: The timestamp when the user was created.
          example: 2019-02-08T11:45:48.899Z
          format: date-time
          type: string
        last_active:
          description: The timestamp when the user was last active.
          example: 2019-02-08T11:45:48.899Z
          format: date-time
          nullable: true
          type: string
        first_name:
          description: The first name of the user.
          maxLength: 36
          minLength: 1
          nullable: true
          type: string
        last_name:
          description: The last name of the user.
          maxLength: 36
          minLength: 1
          nullable: true
          type: string
        metadata:
          additionalProperties:
            nullable: true
          default: {}
          description: Custom metadata associated with the user.
          type: object
        is_admin:
          description: Whether the user is an admin or not.
          type: boolean
        user_type:
          description: The user type.
          enum:
          - default
          - mobile
          - embed
          type: string
        seat_type:
          description: The user's seat type. Only meaningful on plans that have the
            Named Seats feature; on other plans the value is informational. Setting
            this field via API requires the Named Seats feature.
          enum:
          - builder
          - internalUser
          - externalUser
          nullable: true
          type: string
        two_factor_auth_enabled:
          description: Whether two-factor authentication is enabled for this user.
          type: boolean
      required:
      - active
      - created_at
      - email
      - first_name
      - id
      - is_admin
      - last_active
      - last_name
      - legacy_id
      - metadata
      - two_factor_auth_enabled
      - user_type
      type: object
    group:
      description: This object represents a permission group. A permission group is
        a list of users by which to restrict access. You add users to one or more
        groups and then configure the group's level of access. This applies the same
        permissions to all group members. See https://docs.retool.com/org-users/concepts/permission-groups
        or more information.
      properties:
        id:
          description: The ID of the group. Currently this is the same legacy_id but
            will change in the future.
          nullable: true
          type: number
        legacy_id:
          description: The legacy ID of the group.
          nullable: true
          type: number
        name:
          description: The name of the group.
          type: string
        members:
          description: The members of the group.
          items:
            $ref: '#/components/schemas/_groups__groupId__get_200_response_data_members_inner'
          type: array
        universal_app_access:
          description: The universal app access level for the group. This denotes
            the access level that this group has for all apps.
          enum:
          - none
          - use
          - edit
          - own
          type: string
        universal_resource_access:
          description: The universal resource access level for the group. This denotes
            the access level that this group has for all resources.
          enum:
          - none
          - use
          - edit
          - own
          type: string
        universal_workflow_access:
          description: The universal workflow access level for the group. This denotes
            the access level that this group has for all workflows.
          enum:
          - none
          - use
          - edit
          - own
          type: string
        universal_query_library_access:
          description: Level of access that the group has to the Query Library.
          enum:
          - none
          - use
          - edit
          type: string
        user_invites:
          description: A list of user invites that will be added to the group.
          items:
            $ref: '#/components/schemas/_groups__groupId__get_200_response_data_user_invites_inner'
          type: array
        user_list_access:
          description: Whether the group has access to the user list.
          type: boolean
        audit_log_access:
          description: Whether the group has access to the audit log.
          type: boolean
        unpublished_release_access:
          description: Whether the group has access to unpublished releases.
          type: boolean
        usage_analytics_access:
          description: Whether the group has access to usage analytics.
          type: boolean
        theme_access:
          description: Whether the group has access to edit themes.
          type: boolean
        account_details_access:
          description: Whether the group has access to account details.
          type: boolean
        landing_page_app_id:
          description: The app ID of the landing page.
          format: uuid
          nullable: true
          type: string
        created_at:
          example: 2019-02-08T11:45:48.899Z
          type: string
        updated_at:
          example: 2019-02-24T18:28:18.790Z
          type: string
      required:
      - account_details_access
      - audit_log_access
      - created_at
      - id
      - landing_page_app_id
      - legacy_id
      - members
      - name
      - theme_access
      - universal_app_access
      - universal_query_library_access
      - universal_resource_access
      - universal_workflow_access
      - unpublished_release_access
      - updated_at
      - usage_analytics_access
      - user_invites
      - user_list_access
      type: object
    folder:
      description: "This object represents app, resource and workflows folders."
      properties:
        id:
          description: The id of the folder. Currently this is the same as legacy_id
            but will be different in the future.
          pattern: "^(app|workflow|resource|agent|library)_([0-9]\\d*)$"
          type: string
        legacy_id:
          description: The legacy id of the folder.
          pattern: "^(app|workflow|resource|agent|library)_([0-9]\\d*)$"
          type: string
        name:
          description: The name of the folder
          type: string
        parent_folder_id:
          description: The id of the parent folder
          nullable: true
          pattern: "^(app|workflow|resource|agent|library)_([0-9]\\d*)$"
          type: string
        is_system_folder:
          description: Whether the folder is a system folder
          type: boolean
        folder_type:
          description: The type of the folder
          enum:
          - app
          - workflow
          - resource
          - agent
          - library
          type: string
        created_at:
          example: 2019-02-08T11:45:48.899Z
          type: string
        updated_at:
          example: 2019-02-24T18:28:18.790Z
          type: string
      required:
      - created_at
      - folder_type
      - id
      - is_system_folder
      - legacy_id
      - name
      - updated_at
      type: object
    space:
      additionalProperties: false
      description: This object represents a space. Spaces can be used to separate
        your organization's data.
      properties:
        id:
          description: The id of the space.
          format: uuid
          type: string
        name:
          minLength: 1
          type: string
        domain:
          minLength: 1
          type: string
        created_at:
          example: 2019-02-08T11:45:48.899Z
          format: date-time
          type: string
        updated_at:
          example: 2019-02-24T18:28:18.79Z
          format: date-time
          type: string
      required:
      - created_at
      - domain
      - id
      - name
      - updated_at
      type: object
    source_control_configuration:
      anyOf:
      - $ref: '#/components/schemas/GitHub'
      - $ref: '#/components/schemas/GitLab'
      - $ref: '#/components/schemas/AWS_CodeCommit'
      - $ref: '#/components/schemas/Bitbucket'
      - $ref: '#/components/schemas/Azure_Repos'
      description: "This object represents the Source Control provider configuration\
        \ for the organization or space. See [docs](https://docs.retool.com/source-control)\
        \ for more information."
    source_control_settings:
      properties:
        auto_branch_naming_enabled:
          description: "When enabled, Retool automatically suggests a branch name\
            \ on branch creation. Defaults to true."
          type: boolean
        custom_pull_request_template_enabled:
          description: "When enabled, Retool will use the template specified to create\
            \ pull requests. Defaults to false."
          type: boolean
        custom_pull_request_template:
          description: Pull requests created from Retool will use the template specified.
          type: string
        version_control_locked:
          description: "When set to true, creates a read-only instance of Retool,\
            \ where app editing is disabled. Defaults to false."
          type: boolean
        force_uuid_mapping:
          description: "When set to true, creates a uuid mapping for protected elements\
            \ to be used in the source control repo. Defaults to false."
          type: boolean
        auto_cleanup_branches_enabled:
          description: "When set to true, Retool will automatically delete branches\
            \ after changes are merged if the remote branch no longer exists and there\
            \ are no uncommitted changes. Defaults to true."
          type: boolean
      required:
      - auto_branch_naming_enabled
      - auto_cleanup_branches_enabled
      - custom_pull_request_template
      - custom_pull_request_template_enabled
      - force_uuid_mapping
      - version_control_locked
      type: object
    app_theme:
      description: This object represents an app theme. App themes allow you to customize
        the look of your app. See https://docs.retool.com/apps/web/concepts/themes
        for more information.
      properties:
        id:
          type: number
        legacy_id:
          type: number
        name:
          description: The name of the app theme.
          type: string
        theme:
          additionalProperties:
            nullable: true
          description: The theme object.
          type: object
        created_at:
          description: Date and time when the app theme was created.
          format: date-time
          type: string
        updated_at:
          description: Date and time when the app theme was last updated.
          format: date-time
          type: string
      required:
      - created_at
      - id
      - legacy_id
      - name
      - theme
      - updated_at
      type: object
    app:
      description: This object represents an app.
      properties:
        id:
          description: The app ID.
