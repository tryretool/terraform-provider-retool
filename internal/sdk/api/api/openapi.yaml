openapi: 3.0.0
info:
  description: |-
    The Retool API enables you to programmatically perform actions across your organization and its spaces. You can perform RESTful requests to manage a wide range of objects, such as adding users or updating resource configurations.

    ## Base URL

    All endpoints are relative to your Retool instance URL:

    ```
    https://{your-retool-instance}/api/v2
    ```

    ## Authentication

    The Retool API uses HTTP Bearer authentication scheme with API tokens to authenticate requests. Users with sufficient permissions can create API tokens in the organization's [Retool API settings](/auth/login?redirectOnLogin=settings/api). Each token can be scoped to specific permissions—only grant the scopes needed for your use case.

    ```
    Authorization: Bearer YOUR_API_TOKEN
    ```

    ## Versioning

    The API version corresponds to the Retool release version in which it was shipped. This means the API version reflects the features and endpoints available in that release. When you upgrade your Retool instance, the API version updates alongside it and any new endpoints or capabilities introduced in that release become available.
  title: Retool API
  version: 4.0.0
externalDocs:
  description: Retool API Documentation
  url: /reference
servers:
- url: https://stable-4-0.retool.dev/api/v2
security:
- BearerAuth: []
tags:
- description: Manage user accounts at the organization level. Users are created in
    the organization and must be granted access to specific spaces through `groups`.
  name: Users
- description: "Manage permission groups for the organization or specific spaces.\
    \ Groups control which users have access to certain functions and features, such\
    \ as `apps`, `resources`, and `workflows`. Add or remove users from groups to\
    \ grant or revoke access."
  name: Groups
- description: "Manage app, workflow, resource, agent, and library folders within\
    \ your organization."
  name: Folders
- description: "Manage spaces within your organization. Spaces enable organizations\
    \ to implement isolated, multitenant experiences without the need for multiple\
    \ instances. Create spaces, copy elements between spaces, and manage space settings.\
    \ User access to spaces is controlled through `groups`."
  name: Spaces
- description: Manage apps within your organization.
  name: Apps
- description: Manage workflows within your organization.
  name: Workflows
- description: Manage resources within your organization.
  name: Resources
- description: "Manage environment-specific configurations for resources. Resource\
    \ configurations allow you to define different settings for a resource based on\
    \ the environment (e.g., development, staging, production) in which it is used."
  name: Resource Configurations
- description: "Manage access permissions for `apps` and `folders`. Grant or revoke\
    \ permissions for `groups`, and retrieve access lists for specific objects."
  name: Permissions
- description: Manage custom attributes for users in your organization. User attributes
    store additional metadata about users and can be used to control access and personalize
    app behavior.
  name: User Attributes
- description: "Manage pending invitations to your organization. Create, retrieve,\
    \ and delete user invites, and manage user attributes on invites before users\
    \ accept."
  name: User Invites
- description: Manage API access tokens for your organization. Access tokens authenticate
    API requests and can be scoped to specific permissions.
  name: Access Tokens
- description: Manage requests from users who need access to `apps` or other resources.
    Approve or deny pending access requests within your organization.
  name: Access Requests
- description: "Manage environments within your organization. Environments allow you\
    \ to run `resources` against different configurations, such as development, staging,\
    \ and production."
  name: Environments
- description: Manage configuration variables across your organization. Config variables
    store environment-specific values that can be referenced by `resources` and queries.
  name: Configuration Variables
- description: Manage single sign-on (SSO) configuration for your organization. Configure
    and remove identity provider settings to control how users authenticate.
  name: SSO
- description: Manage custom component libraries in your organization. Custom component
    libraries extend the Retool component set in classic apps with reusable components
    built with standard web technologies.
  name: Custom Component Libraries
- description: "Manage source control configuration and deployments for your organization.\
    \ Connect a Git provider, deploy changes, and track deployment history."
  name: Source Control
- description: Manage release manifests and versioned releases for `apps` within your
    organization. Release manifests define which version of each app is promoted to
    production.
  name: Release Management
- description: "Manage app themes within your organization. Themes define the visual\
    \ style of your apps, including colors, typography, and component defaults."
  name: App Themes
- description: "Manage your Retool organization. An organization is a distinct collection\
    \ of users and data. They operate separately from one another, have their own\
    \ configuration settings, and are where users share access to work."
  name: Organization
- description: "Retrieve usage data for your organization. Access summaries and detailed\
    \ breakdowns of page views, active users, and app activity across organizations."
  name: Usage
- description: "Manage user tasks generated by `workflows`. List, submit, cancel,\
    \ and reassign tasks assigned to users or `groups`."
  name: User Tasks
- description: Retrieve details about individual workflow run executions.
  name: Workflow Runs
- description: Trigger and manage process runs within your organization.
  name: Processes
- description: Manage observability configurations for your organization. Connect
    an observability provider to receive error events and monitor your Retool instance.
  name: Observability
- description: "Retrieve system information for your Retool instance, such as IP allowlists\
    \ by region."
  name: Info
paths:
  /users/{userId}:
    delete:
      description: Disables a user from the organization. Requires the `users:write`
        scope.
      parameters:
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          description: The unique identifier for the user.
          example: user_1234
          pattern: "user_([a-z0-9]+)"
          type: string
        style: simple
      responses:
        "204":
          description: The user has been successfully disabled.
      summary: Delete a user
      tags:
      - Users
      x-badges:
      - color: blue
        label: Enterprise
    get:
      description: Returns the specified user. Requires the `users:read` scope.
      parameters:
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          description: The unique identifier for the user.
          example: user_1234
          pattern: "user_([a-z0-9]+)"
          type: string
        style: simple
      - explode: true
        in: query
        name: includeGroups
        required: false
        schema:
          default: false
          description: Whether to include a list of groups for which this user is
            a member.
          nullable: true
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_users__userId__get_200_response'
          description: The requested user.
      summary: Get a user
      tags:
      - Users
      x-badges:
      - color: blue
        label: Enterprise
    patch:
      description: Updates a user and returns the updated user. Requires the `users:write`
        scope.
      parameters:
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          description: The unique identifier for the user.
          example: user_1234
          pattern: "user_([a-z0-9]+)"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_users__userId__patch_request'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_users__userId__patch_200_response'
          description: The updated user.
      summary: Update a user
      tags:
      - Users
      x-badges:
      - color: blue
        label: Enterprise
  /users:
    get:
      description: Returns a list of users. Requires the `users:read` scope.
      parameters:
      - explode: true
        in: query
        name: email
        required: false
        schema:
          description: Filter users by email address.
          type: string
        style: form
      - explode: true
        in: query
        name: first_name
        required: false
        schema:
          description: Filter users by first name.
          type: string
        style: form
      - explode: true
        in: query
        name: last_name
        required: false
        schema:
          description: Filter users by last name.
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          description: "Maximum number of items to return per page. If not provided,\
            \ all items are returned. When provided, enables pagination and the response\
            \ will include next_token for retrieving subsequent pages. Valid range:\
            \ 1-100."
          example: 50
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: next_token
        required: false
        schema:
          description: Cursor token for retrieving the next page of results. Obtained
            from the next_token field of a previous paginated response. Only valid
            when the limit parameter is also provided.
          example: eyJsYXN0SWQiOjEyM30...
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_users_get_200_response'
          description: A list of matching users.
      summary: List users
      tags:
      - Users
      x-badges:
      - color: blue
        label: Enterprise
    post:
      description: Creates a user and returns the created user. Requires the `users:write`
        scope.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_users_post_request'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_users_post_200_response'
          description: The created user.
      summary: Create a user
      tags:
      - Users
      x-badges:
      - color: blue
        label: Enterprise
  /users/reset2fa/{userId}:
    put:
      description: Disables all two-factor authentication methods for the specified
        user. Requires the `users:write` scope.
      parameters:
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          description: The unique identifier for the user.
          example: user_1234
          pattern: "user_([a-z0-9]+)"
          type: string
        style: simple
      responses:
        "204":
          description: Two-factor authentication has been successfully reset.
      summary: Reset a user's two-factor authentication
      tags:
      - Users
      x-badges:
      - color: blue
        label: Enterprise
  /users/{userId}/logout:
    post:
      description: Terminates all active Retool sessions for the specified user. Optionally
        initiates an RP-initiated logout with the configured OIDC SSO provider by
        returning an `sso_logout_url` that the caller must redirect the user's browser
        to. Requires the `users:write` scope.
      parameters:
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          description: The unique identifier for the user.
          example: user_1234
          pattern: "user_([a-z0-9]+)"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_users__userId__logout_post_request'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_users__userId__logout_post_200_response'
          description: The user has been logged out.
      summary: Log out a user
      tags:
      - Users
  /users/{userId}/user_attributes:
    post:
      description: Creates or updates a user attribute and returns the updated user
        metadata. Requires the `users:write` or `user_attributes:write` scope.
      parameters:
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          description: The unique identifier for the user.
          example: user_1234
          pattern: "user_([a-z0-9]+)"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_users__userId__user_attributes_post_request'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_users__userId__user_attributes_post_200_response'
          description: The updated user metadata.
      summary: Create or update a user attribute
      tags:
      - User Attributes
      x-badges:
      - color: green
        label: Business
      - color: blue
        label: Enterprise
  /users/{userId}/user_attributes/{attributeName}:
    delete:
      description: Deletes a user attribute and returns the updated user metadata.
        Requires the `users:write` or `user_attributes:write` scope.
      parameters:
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          description: The unique identifier for the user.
          example: user_1234
          pattern: "user_([a-z0-9]+)"
          type: string
        style: simple
      - explode: false
        in: path
        name: attributeName
        required: true
        schema:
          description: The name of the user attribute to delete.
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_users__userId__user_attributes__attributeName__delete_200_response'
          description: The updated user metadata.
      summary: Delete a user attribute
      tags:
      - User Attributes
      x-badges:
      - color: green
        label: Business
      - color: blue
        label: Enterprise
  /groups/{groupId}:
    delete:
      description: Deletes the specified group. Requires the `groups:write` scope.
      parameters:
      - explode: false
        in: path
        name: groupId
        required: true
        schema:
          description: The group's ID number.
          pattern: ^\d+$
          type: string
        style: simple
      responses:
        "204":
          description: The group has been successfully deleted.
      summary: Delete a group
      tags:
      - Groups
      x-badges:
      - color: blue
        label: Enterprise
    get:
      description: Returns the specified group. Requires the `groups:read` scope.
      parameters:
      - explode: false
        in: path
        name: groupId
        required: true
        schema:
          description: The group's ID number.
          pattern: ^\d+$
          type: string
        style: simple
      - explode: true
        in: query
        name: excludeDisabledUsers
        required: false
        schema:
          description: Whether to exclude disabled users from the members list in
            the response.
          nullable: true
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_groups__groupId__get_200_response'
          description: The requested group.
      summary: Get a group
      tags:
      - Groups
      x-badges:
      - color: blue
        label: Enterprise
    patch:
      description: Updates a group in an organization using JSON Patch (RFC 6902)
        and returns the updated group. Requires the `groups:write` scope.
      parameters:
      - explode: false
        in: path
        name: groupId
        required: true
        schema:
          description: The group's ID number.
          pattern: ^\d+$
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_groups__groupId__patch_request'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_groups__groupId__put_200_response'
          description: The updated group.
      summary: Update a group
      tags:
      - Groups
      x-badges:
      - color: blue
        label: Enterprise
    put:
      description: Replaces the entire group and returns the updated group. Requires
        the `groups:write` scope.
      parameters:
      - explode: false
        in: path
        name: groupId
        required: true
        schema:
          description: The group's ID number.
          pattern: ^\d+$
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_groups__groupId__put_request'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_groups__groupId__put_200_response'
          description: The updated group.
      summary: Replace a group
      tags:
      - Groups
      x-badges:
      - color: blue
        label: Enterprise
  /groups:
    get:
      description: Returns a list of permission groups for an organization or space.
        Requires the `groups:read` scope.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_groups_get_200_response'
          description: A list of groups.
      summary: List groups
      tags:
      - Groups
      x-badges:
      - color: blue
        label: Enterprise
    post:
      description: Creates a group and returns the created group. Requires the `groups:write`
        scope.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_groups_post_request'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_groups_post_200_response'
          description: The created group.
      summary: Create a group
      tags:
      - Groups
      x-badges:
      - color: blue
        label: Enterprise
  /groups/{groupId}/user_invites:
    post:
      description: Adds user invites to the specified group and returns the updated
        group. Requires the `groups:write` scope.
      parameters:
      - explode: false
        in: path
        name: groupId
        required: true
        schema:
          description: The group's ID number.
          pattern: ^\d+$
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_groups__groupId__user_invites_post_request'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_groups__groupId__put_200_response'
          description: The updated group.
      summary: Add user invites to a group
      tags:
      - Groups
      x-badges:
      - color: blue
        label: Enterprise
  /groups/{groupId}/members:
    post:
      description: "Adds specified user(s) to a group and returns the updated group.\
        \ Can optionally set or unset group admins by using the `is_group_admin` property.\
        \ If existing members are passed in, group admin status will be updated. You\
        \ cannot remove members using this endpoint. Requires the `groups:write` scope."
      parameters:
      - explode: false
        in: path
        name: groupId
        required: true
        schema:
          description: The group's ID number.
          pattern: ^\d+$
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_groups__groupId__members_post_request'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_groups__groupId__put_200_response'
          description: The updated group.
      summary: Add users to a group
      tags:
      - Groups
      x-badges:
      - color: blue
        label: Enterprise
  /groups/{groupId}/members/{userId}:
    delete:
      description: Removes the specified user from the group and returns the updated
        group. Requires the `groups:write` scope.
      parameters:
      - explode: false
        in: path
        name: groupId
        required: true
        schema:
          description: The group's ID number.
          pattern: ^\d+$
          type: string
        style: simple
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          description: The unique identifier for the user.
          example: user_1234
          pattern: "user_([a-z0-9]+)"
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_groups__groupId__put_200_response'
          description: The updated group.
      summary: Remove a user from a group
      tags:
      - Groups
      x-badges:
      - color: blue
        label: Enterprise
  /groups/{groupId}/user_invites/{userInviteId}:
    delete:
      description: Removes the specified user invite from the group. Requires the
        `groups:write` scope.
      parameters:
      - explode: false
        in: path
        name: groupId
        required: true
        schema:
          description: The group's ID number.
          pattern: ^\d+$
          type: string
        style: simple
      - explode: false
        in: path
        name: userInviteId
        required: true
        schema:
          description: The user invite's ID number.
          pattern: ^\d+$
          type: string
        style: simple
      responses:
        "204":
          content: {}
          description: The user invite has been successfully removed from the group.
      summary: Remove a user invite from a group
      tags:
      - Groups
      x-badges:
      - color: blue
        label: Enterprise
  /folders:
    get:
      description: Returns a list of folders. Requires the `folders:read` scope.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_folders_get_200_response'
          description: A paginated list of folders.
      summary: List folders
      tags:
      - Folders
      x-badges:
      - color: blue
        label: Enterprise
    post:
      description: Creates a folder and returns the created folder. Requires the `folders:write`
        scope.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_folders_post_request'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_folders_post_200_response'
          description: The created folder.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_folders_post_409_response'
          description: Folder with the same name already exists.
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_folders_post_409_response'
          description: Error with folder structure.
      summary: Create a folder
      tags:
      - Folders
      x-badges:
      - color: blue
        label: Enterprise
  /folders/{folderId}:
    delete:
      description: Deletes the specified folder. Requires the `folders:write` scope.
      parameters:
      - explode: false
        in: path
        name: folderId
        required: true
        schema:
          description: The id of the folder
          pattern: "^(app|workflow|resource|agent|library)_([0-9]\\d*)$"
          type: string
        style: simple
      - explode: true
        in: query
        name: recursive
        required: false
        schema:
          description: Should the folder's contents also be deleted? (Only supported
            for app folders.)
          nullable: true
          type: boolean
        style: form
      responses:
        "204":
          description: The folder has been successfully deleted.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_folders_post_409_response'
          description: Folder not found.
      summary: Delete a folder
      tags:
      - Folders
      x-badges:
      - color: blue
        label: Enterprise
    get:
      description: Returns the specified folder. Requires the `folders:read` scope.
      parameters:
      - explode: false
        in: path
        name: folderId
        required: true
        schema:
          description: The id of the folder
          pattern: "^(app|workflow|resource|agent|library)_([0-9]\\d*)$"
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_folders__folderId__get_200_response'
          description: The requested folder.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_folders_post_409_response'
          description: Folder not found.
      summary: Get a folder
      tags:
      - Folders
      x-badges:
      - color: blue
        label: Enterprise
    patch:
      description: Updates a folder and returns the updated folder. Requires the `folders:write`
        scope.
      parameters:
      - explode: false
        in: path
        name: folderId
        required: true
        schema:
          description: The id of the folder
          pattern: "^(app|workflow|resource|agent|library)_([0-9]\\d*)$"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_folders__folderId__patch_request'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_folders__folderId__patch_200_response'
          description: The updated folder.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_folders_post_409_response'
          description: Folder not found.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_folders_post_409_response'
          description: Folder with the same name already exists.
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_folders_post_409_response'
          description: Error with folder structure.
      summary: Update a folder
      tags:
      - Folders
      x-badges:
      - color: blue
        label: Enterprise
  /spaces:
    get:
      description: Returns a list of child spaces within the current space. Requires
        the `spaces:read` scope.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_spaces_get_200_response'
          description: A list of spaces.
      summary: List spaces
      tags:
      - Spaces
      x-badges:
      - color: blue
        label: Enterprise
    post:
      description: Creates a space and returns the created space. Requires the `spaces:write`
        scope.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_spaces_post_request'
      responses:
        "200":
          content:
            application/json:
